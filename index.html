<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#231f20" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Dispatch" />
  <title>D’Angelo Dispatch</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon.png?v=3" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="mobile-polish.css" />
</head>
<body>
  <div id="app"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="mobile.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        registrations.forEach(registration => registration.unregister());
      }).catch(() => {});
    }
    if ('caches' in window) {
      caches.keys().then(keys => Promise.all(keys.filter(key => key.startsWith('dangelo-dispatch-')).map(key => caches.delete(key)))).catch(() => {});
    }
  </script>
</body>
</html>
