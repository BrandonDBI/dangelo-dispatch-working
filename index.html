<body>
  <div id="app"><div class="bootShell" aria-hidden="true"><div class="bootTop"></div><div class="bootToolbar"></div><div class="bootBody"><div class="bootBlock"></div><div class="bootBlock"></div><div class="bootBlock"></div></div></div></div>
  <script src="config.js?v=147"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-persistence.js?v=147"></script>
  <script>
    (async () => {
      try { await window.DANGELO_AUTH_READY; } catch {}
      const scripts = ['app.js?v=147','time-off.js?v=147','restoration.js?v=147','supervisor-tabs.js?v=147','mobile.js?v=147','mobile-instant-nav.js?v=147','mobile-view-buttons.js?v=147','incoming-reorder.js?v=147','half-day.js?v=147','single-day.js?v=147','undo-move.js?v=147','job-search.js?v=147','job-copy-paste.js?v=147','instant-timeoff.js?v=147','holidays.js?v=147'];
      await Promise.all(scripts.map(src => new Promise(resolve => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = resolve;
        document.body.appendChild(s);
      })));
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=147').catch(() => {});
      });
    }
  </script>
  <!-- v132 deploy compact restoration mobile baseline -->
</body>
</html>
