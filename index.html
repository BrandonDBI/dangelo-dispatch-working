<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#231f20" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Schedule" />
  <meta name="application-name" content="D’Angelo Schedule" />
  <title>D’Angelo Schedule</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=4" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=4" />
  <link rel="stylesheet" href="styles.css?v=39" />
  <link rel="stylesheet" href="mobile-polish.css?v=39" />
  <link rel="stylesheet" href="time-off.css?v=39" />
</head>
<body>
  <div id="app"></div>
  <script src="config.js?v=39"></script>
  <script src="auth-persistence.js?v=39"></script>
  <script>
    (async () => {
      try { await window.DANGELO_AUTH_READY; } catch {}
      const scripts = ['app.js?v=39','mobile.js?v=39','incoming-reorder.js?v=39','half-day.js?v=39','single-day.js?v=39','undo-move.js?v=39','time-off.js?v=39','holidays.js?v=39'];
      for (const src of scripts) {
        await new Promise(resolve => {
          const s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = resolve;
          document.body.appendChild(s);
        });
      }
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=39').catch(() => {});
      });
    }
  </script>
</body>
</html>
