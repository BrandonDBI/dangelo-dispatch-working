<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#231f20" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Dispatch" />
  <meta name="application-name" content="D’Angelo Dispatch" />
  <title>Dispatch</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=5" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f4f2;
      color: #231f20;
    }
    main {
      width: min(100%, 430px);
      background: #fff;
      border-radius: 22px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,.10);
    }
    img {
      width: 92px;
      height: 92px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0 0 18px; line-height: 1.45; color: #555; }
    ol {
      margin: 0 0 24px;
      padding-left: 24px;
      text-align: left;
      line-height: 1.55;
    }
    a {
      display: inline-block;
      padding: 13px 18px;
      border-radius: 12px;
      background: #231f20;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <img src="/apple-touch-icon.png?v=5" alt="D’Angelo Dispatch icon" />
    <h1>D’Angelo Dispatch</h1>
    <p>Add this page to your iPhone Home Screen. Once installed, tapping the icon will open the dispatch board directly.</p>
    <ol>
      <li>Tap the Safari Share button.</li>
      <li>Choose <strong>Add to Home Screen</strong>.</li>
      <li>Leave the name as <strong>Dispatch</strong> and tap <strong>Add</strong>.</li>
    </ol>
    <a href="/">Open Dispatch Now</a>
  </main>
  <script>
    const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    if (isStandalone) {
      window.location.replace('/');
    }
  </script>
</body>
</html>
